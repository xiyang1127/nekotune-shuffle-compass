name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software
  QT_QUICK_CONTROLS_STYLE: Fusion

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed cmake ninja qt6-base qt6-declarative git python
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build, test and package
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --no-tests=error
          python -m unittest discover -s tests -p test_release.py
          python scripts/release.py prepare --manifest compass/extension.json \
            --build-info build/packages/nekotune.shuffle-compass-build-info.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-linux
          path: build/release/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Preserve source line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
      - name: Build, test and package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --no-tests=error
          python -m unittest discover -s tests -p test_release.py
          python scripts/release.py prepare --manifest compass/extension.json \
            --build-info build/packages/nekotune.shuffle-compass-build-info.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-windows
          path: build/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: extension-*
          path: dist
          merge-multiple: true
      - name: Verify complete release and write checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 scripts/release.py finalize \
            --manifest compass/extension.json --output dist --platforms linux-x86_64 windows-x86_64 --tag "$TAG"
          uv run --no-project --python 3.12 scripts/release.py verify \
            --manifest compass/extension.json --output dist --platforms linux-x86_64 windows-x86_64 --tag "$TAG"
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_NAME: 漫游罗盘 · Shuffle Compass
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --verify-tag --title "$RELEASE_NAME $TAG" \
            --notes-file RELEASE_NOTES.md --generate-notes --draft --prerelease
